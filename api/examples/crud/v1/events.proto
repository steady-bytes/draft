syntax = "proto3";

package examples.crud.v1;

option go_package = "github.com/steady-bytes/draft/api/examples/crud/v1";

import "examples/crud/v1/models.proto";

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_CREATE = 1;
  OPERATION_UPDATE = 2;
  OPERATION_DELETE = 3;
  // Appended, not inserted alongside CREATE/UPDATE/DELETE above, so existing encoded values (and
  // every producer/examples/producer's weightedOps table) keep their numbers.
  OPERATION_READ = 4;
}

message DatabaseModelSaved {
  string    model_id   = 1;
  string    model_name = 2;
  Operation operation  = 3;
}

// ModelEvent is emitted by the crud-event example service (services/examples/crud-event) every
// time one of its repository methods completes successfully — Create, Read, Update, or Delete —
// carrying the operation performed and the full model involved, not just its id/name the way
// DatabaseModelSaved above does. Reuses Name from models.proto rather than duplicating its fields.
message ModelEvent {
  Operation operation = 1;
  Name      model     = 2;
}
