syntax = "proto3";

package tooling.relay.v1;

option go_package = "github.com/steady-bytes/draft/api/tooling/relay/v1";

import "tooling/relay/v1/models.proto";

// RelayService is Relay's whole API surface -- devices, library, playback, recording, live
// transcription, the archive, and action items. See
// docs/website/content/docs/architecture/relay-implementation-plan.md.
//
// Every RPC that names an output_device_id/input_device_id must be called on the specific Relay
// instance that owns that device -- see the plan's "Multi-instance device ownership" section.
// This proto has no notion of instance addressing itself; that happens at the calling layer (the
// web client, or a future caller), the same way the plan's RPC Interface section documents.
service RelayService {
    // Devices -- always answered from THIS instance's own local hardware, never aggregated
    // server-side (the caller aggregates across instances).
    rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {}

    // Library
    rpc ListTracks(ListTracksRequest) returns (ListTracksResponse) {}
    rpc AddTrack(AddTrackRequest) returns (Track) {} // metadata; bytes arrive via UploadTrack
    rpc UploadTrack(stream UploadTrackChunk) returns (Track) {}
    rpc RescanLibrary(RescanLibraryRequest) returns (RescanLibraryResponse) {}
    // Removes a track's row and its backing audio file from local disk. If the track is a
    // recording's finalized output (Track.recording_id set), the Recording row itself and its
    // transcript are untouched -- that's DeleteRecording's own, separate job (Archive, below); this
    // only ever removes the playable library entry.
    rpc DeleteTrack(DeleteTrackRequest) returns (DeleteTrackResponse) {}

    // Playback -- Play/Pause/Seek/SetVolume target a specific output device, so they're always
    // called on the instance that owns it.
    rpc Play(PlayRequest) returns (PlayerState) {}
    rpc Pause(PauseRequest) returns (PlayerState) {}
    rpc Seek(SeekRequest) returns (PlayerState) {}
    rpc SetVolume(SetVolumeRequest) returns (PlayerState) {}
    rpc GetPlayerState(GetPlayerStateRequest) returns (PlayerState) {}
    rpc StreamAudioOut(StreamAudioOutRequest) returns (stream AudioChunk) {} // "Stream to browser" output

    // Queue
    rpc Enqueue(EnqueueRequest) returns (QueueState) {}
    rpc ClearQueue(ClearQueueRequest) returns (QueueState) {}

    // Recording -- always called on the instance owning the input device, same reasoning as
    // Playback. StreamAudioIn is how a *real* gRPC client-streaming caller (a native capture pump,
    // not a browser) gets bytes to that instance; StreamAudioInChunk (added in Phase 10) is what
    // the Dioxus web client actually uses -- see its own doc for why.
    rpc StartRecording(StartRecordingRequest) returns (Recording) {}
    rpc StreamAudioIn(stream AudioChunk) returns (StreamAudioInResponse) {}
    // StreamAudioInChunk is a Phase 10 addition: grpc-web from a browser cannot truly stream a
    // client-streaming request incrementally -- confirmed by reading tonic-web-wasm-client's own
    // source (its `prepare_body` collects the *entire* request into one `fetch()` call before
    // sending anything), so a live, open-ended microphone recording sent via StreamAudioIn would
    // never reach the server until the browser closed the connection, breaking live transcription
    // entirely. The web client instead calls this unary RPC once per captured buffer; it reuses
    // the exact same ingestion path (RecordingSession.Ingest) StreamAudioIn's own receive loop
    // does, just one chunk per call instead of one call for the whole stream.
    rpc StreamAudioInChunk(AudioChunk) returns (StreamAudioInChunkResponse) {}
    rpc AddMarker(AddMarkerRequest) returns (Marker) {}
    rpc StopRecording(StopRecordingRequest) returns (Recording) {}
    rpc DiscardRecording(DiscardRecordingRequest) returns (DiscardRecordingResponse) {}

    // Live transcript -- the Record page's own streaming captions. A dedicated RPC, not a
    // Catalyst Consume subscription -- same reasoning as Lineman's Watch.
    rpc WatchTranscript(WatchTranscriptRequest) returns (stream TranscriptSegment) {}

    // Archive
    rpc ListRecordings(ListRecordingsRequest) returns (ListRecordingsResponse) {}
    rpc GetRecording(GetRecordingRequest) returns (Recording) {}
    rpc GetTranscript(GetTranscriptRequest) returns (GetTranscriptResponse) {}
    rpc SearchTranscripts(SearchTranscriptsRequest) returns (SearchTranscriptsResponse) {}
    rpc RenameSpeaker(RenameSpeakerRequest) returns (Speaker) {}
    rpc DeleteRecording(DeleteRecordingRequest) returns (DeleteRecordingResponse) {}

    // Action items
    rpc CreateActionItem(CreateActionItemRequest) returns (ActionItem) {}
    rpc ListActionItems(ListActionItemsRequest) returns (ListActionItemsResponse) {}
    rpc CreateLinemanTasks(CreateLinemanTasksRequest) returns (CreateLinemanTasksResponse) {}
}

message AudioChunk {
    bytes  pcm             = 1; // raw PCM16LE, sample_rate_hz/channels fixed per stream at open
    int64  sequence         = 2;
    bool   is_final          = 3;
}

message PlayerState {
    string track_id   = 1;
    int64  position_ms = 2;
    bool   playing      = 3;
    int32  volume_pct   = 4;
    string output_device_id = 5;
}

message QueueState {
    repeated Track upcoming = 1;
}

// -- Devices ------------------------------------------------------------------------------------

message ListDevicesRequest {}

message ListDevicesResponse {
    repeated Device devices = 1;
}

// -- Library --------------------------------------------------------------------------------------

message ListTracksRequest {
    string filter = 1; // free-text over title/artist/album; empty matches everything
}

message ListTracksResponse {
    repeated Track tracks = 1;
}

message AddTrackRequest {
    string title  = 1;
    string artist = 2;
    string album  = 3;
}

message UploadTrackChunk {
    // Set on the first message of the stream only; every following chunk carries only data.
    AddTrackRequest metadata = 1;
    bytes           data      = 2;
    bool            is_final   = 3;
}

message RescanLibraryRequest {}

message RescanLibraryResponse {
    int32 tracks_found = 1;
}

message DeleteTrackRequest {
    string track_id = 1;
}

message DeleteTrackResponse {}

// -- Playback / Queue -----------------------------------------------------------------------------

message PlayRequest {
    string track_id         = 1;
    string output_device_id = 2;
}

message PauseRequest {
    string output_device_id = 1;
}

message SeekRequest {
    string output_device_id = 1;
    int64  position_ms       = 2;
}

message SetVolumeRequest {
    string output_device_id = 1;
    int32  volume_pct        = 2;
}

message GetPlayerStateRequest {
    string output_device_id = 1;
}

message StreamAudioOutRequest {
    string output_device_id = 1;
}

message EnqueueRequest {
    string track_id = 1;
}

message ClearQueueRequest {}

// -- Recording --------------------------------------------------------------------------------------

message StartRecordingRequest {
    string name            = 1;
    string input_device_id = 2;
}

message StreamAudioInResponse {
    string recording_id = 1;
}

message StreamAudioInChunkResponse {}

message AddMarkerRequest {
    string recording_id = 1;
    string label         = 2;
}

message StopRecordingRequest {
    string recording_id = 1;
}

message DiscardRecordingRequest {
    string recording_id = 1;
}

message DiscardRecordingResponse {}

message WatchTranscriptRequest {
    string recording_id = 1;
}

// -- Archive --------------------------------------------------------------------------------------

message ListRecordingsRequest {}

message ListRecordingsResponse {
    repeated Recording recordings = 1;
}

message GetRecordingRequest {
    string id = 1;
}

message GetTranscriptRequest {
    string recording_id = 1;
}

message GetTranscriptResponse {
    repeated TranscriptSegment segments = 1;
}

message SearchTranscriptsRequest {
    string query = 1;
}

// One matched recording, with just the segments that actually hit -- mirrors
// relay-transcripts.html's own list ("4 hits" per row) plus its drawer's excerpt list, without
// forcing a second RPC round trip to get both.
message SearchHit {
    Recording recording               = 1;
    repeated TranscriptSegment matches = 2;
}

message SearchTranscriptsResponse {
    repeated SearchHit hits = 1;
}

message RenameSpeakerRequest {
    string speaker_id = 1;
    string label       = 2;
}

message DeleteRecordingRequest {
    string id = 1;
}

message DeleteRecordingResponse {}

// -- Action items --------------------------------------------------------------------------------

// CreateActionItem is the RPC Phase 6 added that the plan's own original RPC Interface sketch
// missed: ListActionItems/CreateLinemanTasks assume ActionItems already exist, but nothing in the
// original proto could ever create one. Per the plan's own Decisions section ("markers →
// manually-promoted action items first ... a marker or a manually-selected transcript excerpt
// becomes an ActionItem a user explicitly creates"), this covers both origins with one message:
// source_segment_id set for a transcript-excerpt promotion, at_ms alone (no source_segment_id)
// for a Marker promotion, both optional.
message CreateActionItemRequest {
    string recording_id      = 1;
    string text              = 2;
    string source_segment_id = 3;
    int64  at_ms              = 4;
    string speaker_label      = 5;
}

message ListActionItemsRequest {
    string recording_id = 1; // empty matches every recording
}

message ListActionItemsResponse {
    repeated ActionItem action_items = 1;
}

message CreateLinemanTasksRequest {
    repeated string action_item_ids = 1;
}

message CreateLinemanTasksResponse {
    repeated string lineman_task_ids = 1;
}
