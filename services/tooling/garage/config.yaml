service:
  name: garage
  domain: tooling
  entrypoint: http://localhost:2221

  logging:
    level: debug

  network:
    bind_address: localhost
    bind_port: 9301
    # internal.host is advertised to peers (service discovery, OTel export target resolution)
    # and must be reachable from other host-native processes -- see route.host below for the
    # one caller (Envoy, which runs in Docker) that needs a different address.
    internal:
      host: localhost
      port: 9301
    # route.host overrides internal.host for Fuse's route-endpoint auto-fill only (see
    # pkg/chassis/networking.go's getConfigInternalHost).
    route:
      host: host.docker.internal
      port: 9301

telemetry:
  enabled: true

repositories:
  postgres:
    url: postgres://garage:garage@localhost:5432/garage?sslmode=disable
