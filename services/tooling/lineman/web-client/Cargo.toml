[package]
name = "lineman-pwa"
version = "0.1.0"
authors = ["steady-bytes | steady-bytes.com"]
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "0.7.5", features = ["web", "router"] }
dioxus-logger = "0.7.4"
once_cell = "1.21.3"
draft-api = { path = "../../../../api", features = ["web"] }
dioxus-grpc = { path = "../../../../tools/dioxus-grpc", default-features = false }
tonic-web-wasm-client = "0.9.1"
prost = "0.14"
prost-types = "0.14"
chrono = "0.4.44"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.77", features = ["Storage"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
