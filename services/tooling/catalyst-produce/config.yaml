service:
  name: catalyst-produce
  domain: plugins
  entrypoint: http://localhost:2221

  logging:
    level: debug

  network:
    bind_address: localhost
    bind_port: 9306
    internal:
      host: localhost
      port: 9306

telemetry:
  enabled: true

# Garage is a fixed, known dependency for this plugin, the same way
# services/tooling/catalyst-consume's own config.yaml documents.
garage:
  address: http://localhost:9301

# Address this plugin's long-lived Produce stream connects to. Same key/
# default as services/tooling/bench/catalyst.go and catalyst-consume's own
# catalyst.address.
catalyst:
  address: http://localhost:2220
