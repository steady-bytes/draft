service:
  name: bench
  domain: tooling
  entrypoint: http://localhost:2221

  logging:
    level: debug

  network:
    bind_address: localhost
    bind_port: 9300
    # internal.host is advertised to peers (service discovery, OTel export target resolution)
    # and must be reachable from other host-native processes -- see route.host below for the
    # one caller (Envoy, which runs in Docker) that needs a different address.
    internal:
      host: localhost
      port: 9300
    # route.host overrides internal.host for Fuse's route-endpoint auto-fill only (see
    # pkg/chassis/networking.go's getConfigInternalHost). localhost, not host.docker.internal:
    # Fuse's native proxy backend runs on the host, like this process, not in Docker -- it
    # can't resolve host.docker.internal at all (confirmed live, see
    # docs/architecture/fuse-native-proxy-implementation-plan.md's Phase 9 notes). Only the
    # envoy backend (a separate Docker container) needed that hostname; if a cluster runs
    # Fuse with fuse.proxy_backend: envoy, this needs to go back to host.docker.internal.
    route:
      host: localhost
      port: 9300

telemetry:
  enabled: true
  wide_events:
    enabled: true

repositories:
  postgres:
    url: postgres://bench:bench@localhost:5432/bench?sslmode=disable

bench:
  # Directory of workflow YAML files loaded (and upserted into Postgres) at
  # startup — see workflows.go's loadWorkflowsDir. Relative to the process's
  # working directory. Defaults to ./workflows if unset.
  workflows_dir: ./workflows

# Address Bench publishes run/step CloudEvents to (catalyst.go, Phase 7) — same
# key and convention as services/examples/producer's own config.yaml. Defaults to
# http://localhost:2220 if unset.
catalyst:
  address: http://localhost:2220

# Address of Foundry's PluginCatalogService, used by foundry:// steps
# (foundry_plugin.go, Phase 6) to confirm a plugin is published before
# resolving a live instance of it via Blueprint. Defaults to
# http://localhost:9301 if unset.
foundry:
  address: http://localhost:9301
