# Proves the produce/consume round trip end to end in a single run: one step
# publishes a CloudEvent via the catalyst-produce garage plugin, another
# consumes that exact event via catalyst-consume. This only works if
# consume-event and publish-event run as concurrent siblings, not
# sequentially -- Catalyst's Consume has no event replay (see
# docs/website/content/docs/architecture/garage-plugin-repository.md), so a
# consumer that starts listening even a moment after the event was sent has
# permanently missed it. A plain two-step workflow can't express that:
# Bench's "empty depends_on defaults to the previous step" rule (see the
# Primitives section of docs/website/content/docs/architecture/
# bench-workflow-engine.md) means the second of any two steps always
# defaults to depending on the first, so both need an explicit depends_on
# pointing at a shared third step (ready) instead -- that's what makes them
# true siblings the scheduler starts together. publish-event's own
# config.delay then gives consume-event's stream time to actually open
# before the event is sent, rather than leaving it to a bare, latency-biased
# race (the consumer's stream-open round trip is real added latency the
# producer's already-open stream doesn't pay).
apiVersion: bench/v1
kind: Workflow
metadata:
  name: catalyst-produce-consume-e2e
  description: Publishes a CloudEvent via catalyst-produce and consumes that same event via catalyst-consume in a concurrent sibling step.
steps:
  - name: ready
    uses: bench://grpc-call@v1
    with:
      service: tooling.plugin_catalog.v1.PluginCatalogService
      method: List
      request:
        page_size: 1
    expect:
      status: OK
  - name: consume-event
    uses: garage://catalyst-consume@v1
    depends_on: [ready]
    with:
      event_type: tooling.demo.v1.ProduceConsumeRoundTrip
      timeout: 10s
      fields:
        message: message
  - name: publish-event
    uses: garage://catalyst-produce@v1
    depends_on: [ready]
    with:
      event_type: tooling.demo.v1.ProduceConsumeRoundTrip
      subject: produce-consume-demo
      delay: 300ms
      data:
        message: hello from catalyst-produce
    # No expect: block on either garage:// step -- Bench's garage:// executor
    # never reads step.GetExpect(); each plugin's own StepResponse.Success/
    # Error is authoritative, matching catalyst-consume-e2e.yaml's own note.
