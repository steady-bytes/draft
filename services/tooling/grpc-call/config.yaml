service:
  name: grpc-call
  domain: plugins
  entrypoint: http://localhost:2221

  logging:
    level: debug

  network:
    bind_address: localhost
    bind_port: 9305
    internal:
      host: localhost
      port: 9305

telemetry:
  enabled: true
  wide_events:
    enabled: true

# Foundry is a fixed, known dependency for this plugin, the same way
# services/tooling/catalyst-consume's own config.yaml documents.
foundry:
  address: http://localhost:9301
