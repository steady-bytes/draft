{{define "head"}}
<style>
  .fc-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .fc-bar .d-query { width: min(420px, 100%); }
</style>
{{end}}

{{define "content"}}
<div class="d-page-head">
  <div>
    <span class="d-label">Plugin catalog</span>
    <h1>What's on the shelf</h1>
    <p>Every step executor a Bench workflow can reference with <code>uses: foundry://name@version</code>.</p>
  </div>
</div>

<div class="fc-bar">
  <div class="d-query">
    <span class="d-query-lang">SEARCH</span>
    <input
      type="search"
      name="q"
      placeholder="Name or description…"
      aria-label="Search plugins"
      value="{{.Query}}"
      data-shortcut="/"
      hx-get="/partials/catalog-cards"
      hx-trigger="keyup changed delay:300ms, search"
      hx-target="#card-grid"
      hx-swap="outerHTML"
      hx-include="[name='sort'],[name='maintainer']"
    />
  </div>
  <input type="hidden" name="sort" value="{{.Sort}}">
  <input type="hidden" name="maintainer" value="{{.Maintainer}}">
  <span class="d-spacer"></span>
  <span class="d-seg" role="group" aria-label="Sort">{{range .SortLinks}}<a href="{{.Href}}"{{if .Active}} aria-current="true"{{end}}>{{.Label}}</a>{{end}}</span>
</div>

{{template "card-grid" .}}
{{end}}
