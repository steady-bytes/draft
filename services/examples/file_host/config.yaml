service:
  name: file_host
  domain: examples
  env: local
  entrypoint: http://localhost:2221
  logging:
    level: debug

  network:
    bind_address: localhost
    bind_port: 9096
    # internal.host is what WithRoute uses to auto-fill this service's registered endpoint
    # (no separate route.host override here). localhost, not host.docker.internal: Fuse's
    # native proxy backend runs on the host, like this process, not in Docker -- it can't
    # resolve host.docker.internal at all (confirmed live, see
    # docs/architecture/fuse-native-proxy-implementation-plan.md's Phase 9 notes). Only the
    # envoy backend (a separate Docker container) needed that hostname; if a cluster runs
    # Fuse with fuse.proxy_backend: envoy, this needs to go back to host.docker.internal.
    internal:
      host: localhost
      port: 9096
    external:
      host: localhost:10000

telemetry:
  enabled: true
  wide_events:
    enabled: true
