service:
  name: crud
  domain: examples
  env: local
  entrypoint: http://localhost:2221
  logging:
    level: debug

  network:
    bind_address: localhost
    bind_port: 9090
    internal:
      host: localhost
      port: 9090
    external:
      host: localhost:10000

telemetry:
  enabled: true

repositories:
  postgres:
    url: postgres://draft:draft@localhost:5432/draft?sslmode=disable
