service:
  name: beacon
  domain: core
  entrypoint: http://localhost:2221

  logging:
    level: debug

  network:
    bind_port: 2222
    # internal.host is advertised to Blueprint's ServiceDiscoveryService and used by every
    # host-native peer (including chassis's own OTel exporter, resolving "beacon" to send
    # telemetry) — must be reachable from other native processes, so "localhost" here, not
    # "host.docker.internal" (that only resolves inside Docker; see route.host below for the
    # one caller, Envoy, that actually runs there).
    internal:
      host: localhost
      port: 2222
    # route.host overrides internal.host for Fuse's route-endpoint auto-fill only (see
    # pkg/chassis/networking.go's getConfigInternalHost) — Envoy runs inside Docker and needs
    # "host.docker.internal" to reach this (host-native) process; nothing else should use it.
    route:
      host: host.docker.internal
      port: 2222

telemetry:
  enabled: true

# otlp configures Beacon's *separate* OTLP/gRPC ingestion listener. This is not
# managed by chassis (chassis owns service.network.bind_port, Beacon's own
# Connect-RPC surface) — it's a plain grpc.Server on the industry-standard OTLP
# port so any off-the-shelf OTel SDK or Collector can export here unmodified.
otlp:
  bind_address: "0.0.0.0:4317"

# clickhouse points at the same ClickHouse server Catalyst's docker-compose
# already starts (services/core/catalyst/docker-compose.yaml) — Beacon uses a
# separate `database` on that same server, not a second container.
clickhouse:
  enabled: true
  address: "localhost:9000"
  database: "beacon"
  username: "default"
  password: ""
