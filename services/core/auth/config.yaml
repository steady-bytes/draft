service:
  name: auth
  domain: core
  entrypoint: http://localhost:2221

  logging:
    level: debug

  network:
    bind_address: localhost
    bind_port: 9095
    # internal.host is what main.go's writeAuthAddress publishes as auth_service_address --
    # the address the active ProxyBackend's ext_authz-equivalent calls (Envoy's ext_authz
    # filter, or the native backend's own auth middleware). localhost, not
    # host.docker.internal: Fuse's native proxy backend runs on the host, like this process,
    # not in Docker -- it can't resolve host.docker.internal at all (confirmed live, see
    # docs/architecture/fuse-native-proxy-implementation-plan.md's Phase 9 notes). Only the
    # envoy backend (a separate Docker container) needed that hostname; if a cluster runs
    # Fuse with fuse.proxy_backend: envoy, this needs to go back to host.docker.internal.
    internal:
      host: localhost
      port: 9095

telemetry:
  enabled: true
  wide_events:
    enabled: true

# auth.mode controls whether the service validates tokens (authentik) or allows
# all requests through (bypass). Use bypass for local development without Authentik.
auth:
  mode: bypass
  authentik:
    url: http://localhost:9050
