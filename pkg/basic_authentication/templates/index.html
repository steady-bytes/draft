<!DOCTYPE html>
<html lang="en" data-theme="draft">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}Sign in{{ end }}</title>
    <!-- The Draft design system. Serve its assets at /static/draft/ with
         `mux.Handle("GET "+draftui.StaticPrefix, draftui.Static())`
         (github.com/steady-bytes/draft/tools/draft-ui) or copy tools/draft-ui/dist there. -->
    <link rel="stylesheet" href="/static/draft/fonts.css">
    <link rel="stylesheet" href="/static/draft/draft.css">
    <script src="/static/draft/draft.js"></script>
</head>
<body>
    {{ block "content" . }}{{ end }}
</body>
</html>
