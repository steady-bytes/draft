baseURL: https://draft.steady-bytes.com/
languageCode: en-us
title: Draft

module:
  replacements: github.com/home-cloud-io/lotusdocs -> lotusdocs
  imports:
    - path: github.com/home-cloud-io/lotusdocs
      disable: false
    - path: github.com/gohugoio/hugo-mod-bootstrap-scss/v5
      disable: false
    # The design system's docs theme (tools/draft-ui/dist/docs) and the fonts it names. The module
    # is a local directory: go.mod's `replace` points at it.
    - path: github.com/steady-bytes/draft/tools/draft-ui
      mounts:
        - source: dist/docs
          target: assets/docs/scss/custom/colors
        - source: dist/fonts
          target: static/draft/fonts
  mounts:
    - source: static
      target: static
    - source: images
      target: static/images

params:
  # Body and code fonts (lotusdocs reads these into its Sass); the @font-face rules ship with the
  # docs theme above.
  sans_serif_font: "'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif"
  secondary_font: "'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif"
  mono_font: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
  docs:
    themeColor: draft   # custom/colors/_draft.scss, from tools/draft-ui
    darkMode: true
    descriptions: true
    sidebarIcons: true
    titleIcon: true
    repoURL: https://github.com/steady-bytes/draft
    editPage: true
    lastMod: true
    intLinkTooltip: true
    prism: true
    prismTheme: lotusdocs
  social:
    github: steady-bytes/draft
  plausible:
    dataDomain: draft.steady-bytes.com
    scriptURL: https://plausible.steady-bytes.com/js/script.js
  footer:
    copyright: "Created by [Steady Bytes](https://steady-bytes.com) | :YEAR:"

markup:
  goldmark:
    renderer:
      unsafe: true


